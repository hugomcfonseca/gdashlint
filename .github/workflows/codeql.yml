name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "24 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c8e3174949dcd2ceb71718aeaa53fee4dc9052f2 # v4.31.7
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@c8e3174949dcd2ceb71718aeaa53fee4dc9052f2 # v4.31.7

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@c8e3174949dcd2ceb71718aeaa53fee4dc9052f2 # v4.31.7
