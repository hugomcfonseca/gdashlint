name: PR title

# pull_request_target lets the check run for pull requests from forks. It is
# safe here because the job never checks out or executes code from the pull
# request; it only reads the title through the API.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  lint:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Pull requests are squash-merged, so the title becomes the commit on
      # main that semantic-release reads to calculate the next version.
      - name: Validate pull request title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
