name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true


      - name: Run tests
        run: go test ./...

      # Calculates the next version from Conventional Commits since the last
      # v* tag and pushes the new tag. Does nothing when there are no
      # releasable commits (feat, fix, perf or breaking changes).
      # Configuration lives in .releaserc.yaml.
      - name: Calculate version and tag
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: 25.0.9
          extra_plugins: conventional-changelog-conventionalcommits@10.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Resolved from git rather than the action output so that re-running a
      # failed run (tag already pushed, nothing new to release) still resumes
      # at the publishing steps.
      - name: Resolve release tag
        id: version
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.version.outputs.tag != ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.version.outputs.tag != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: steps.version.outputs.tag != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        if: steps.version.outputs.tag != ''
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
