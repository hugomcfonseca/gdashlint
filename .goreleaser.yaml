version: 2

project_name: gdashlint

before:
  hooks:
    - go mod tidy

builds:
  - id: gdashlint
    main: ./cmd/gdashlint
    binary: gdashlint
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: gdashlint
    ids:
      - gdashlint
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE
      - docs/BUILTIN_RULES.md
      - docs/CONFIGURATION.md

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: gdashlint
    ids:
      - gdashlint
    images:
      - docker.io/hugomcfonseca/gdashlint
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Grafana dashboard linter
      org.opencontainers.image.url: https://github.com/hugomcfonseca/gdashlint
      org.opencontainers.image.source: https://github.com/hugomcfonseca/gdashlint
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    annotations:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Grafana dashboard linter
      org.opencontainers.image.url: https://github.com/hugomcfonseca/gdashlint
      org.opencontainers.image.source: https://github.com/hugomcfonseca/gdashlint
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    sbom: false

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: hugomcfonseca
    name: gdashlint
  draft: false
  prerelease: auto
  mode: replace
